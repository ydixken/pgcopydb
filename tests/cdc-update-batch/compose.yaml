services:
  source:
    build:
      context: ../cdc-wal2json
      dockerfile: Dockerfile.pg
      args:
        PGVERSION: ${PGVERSION:-16}
    expose:
      - 5432
    env_file:
      - ../postgres.env
    # Patched PostgreSQL releases allow only the output plugins listed here.
    command: >
      -c wal_level=logical
      -c output_plugin_libraries=pgoutput,test_decoding,wal2json
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key

  target:
    image: postgres:${PGVERSION:-16}
    expose:
      - 5432
    env_file:
      - ../postgres.env
    command: >
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key

  test:
    image: cdc-update-batch
    build: .
    environment:
      PGSSLMODE: "require"
      PGCOPYDB_SOURCE_PGURI: postgres://postgres:h4ckm3@source/postgres
      PGCOPYDB_TARGET_PGURI: postgres://postgres:h4ckm3@target/postgres
      PGCOPYDB_TABLE_JOBS: 2
      PGCOPYDB_INDEX_JOBS: 2
    depends_on:
      - source
      - target
