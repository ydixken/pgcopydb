# the servers carry the cfgdump test extension of tests/all-databases
services:
  source:
    build:
      context: ../all-databases
      dockerfile: Dockerfile.pg
      args:
        - PGVERSION=${PGVERSION:-16}
    expose:
      - 5432
    env_file:
      - ../postgres.env
    command: >
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key

  target:
    build:
      context: ../all-databases
      dockerfile: Dockerfile.pg
      args:
        - PGVERSION=${PGVERSION:-16}
    expose:
      - 5432
    env_file:
      - ../postgres.env
    command: >
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key

  test:
    image: large-objects-resume
    build: .
    env_file:
      - ../uris.env
    depends_on:
      - source
      - target
