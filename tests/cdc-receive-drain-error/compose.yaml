services:
  source:
    image: postgres:${PGVERSION:-16}
    expose:
      - 5432
    env_file:
      - ../postgres.env
    # The suite waits for this timeout to close the stream under receive.
    command: >
      -c wal_level=logical
      -c wal_sender_timeout=5s
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
  target:
    image: postgres:${PGVERSION:-16}
    expose:
      - 5432
    env_file:
      - ../postgres.env
    command: >
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
  test:
    build:
      context: .
      dockerfile: Dockerfile
    cap_add:
      - SYS_PTRACE
    env_file:
      - ../uris.env
    depends_on:
      - source
      - target
