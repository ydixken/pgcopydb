services:
  source:
    image: postgres:${PGVERSION:-16}
    expose:
      - 5432
    env_file:
      - ../postgres.env
    command: >
      -c wal_level=logical
      -c wal_sender_timeout=5s
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key

  target:
    image: postgres:${PGVERSION:-16}
    expose:
      - 5432
    env_file:
      - ../postgres.env
    command: >
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key

  test:
    image: cdc-receive-group-commit
    build: .
    cap_add:
      - SYS_PTRACE
    environment:
      PGSSLMODE: "require"
      PGCOPYDB_SOURCE_PGURI: postgres://postgres:h4ckm3@source/postgres
      PGCOPYDB_TARGET_PGURI: postgres://postgres:h4ckm3@target/postgres
      PGCOPYDB_TABLE_JOBS: 2
      PGCOPYDB_INDEX_JOBS: 2
      PGCOPYDB_OUTPUT_PLUGIN: pgoutput
      GC_CASE: ${GC_CASE:-}
    depends_on:
      - source
      - target
