services:
  source:
    image: postgres:${PGVERSION:-16}
    expose:
      - 5432
    env_file:
      - ../postgres.env
    command: >
      -c wal_level=logical
      -c wal_sender_timeout=5s
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key

  # an old source, whose pgoutput sends BEGIN from the begin callback
  source14:
    image: postgres:14-bullseye
    expose:
      - 5432
    env_file:
      - ../postgres.env
    command: >
      -c wal_level=logical
      -c wal_sender_timeout=5s
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key

  target:
    image: postgres:${PGVERSION:-16}
    expose:
      - 5432
    env_file:
      - ../postgres.env
    command: >
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key

  test:
    image: cdc-spool-resend
    build: .
    env_file:
      - ../uris.env
    environment:
      PGCOPYDB_TABLE_JOBS: 2
      PGCOPYDB_INDEX_JOBS: 2
      PGCOPYDB_OUTPUT_PLUGIN: pgoutput
      PGCOPYDB_FOLLOW_MODE: performance
      RESEND_CASE: ${RESEND_CASE:-}
    volumes:
      # The second work directory of the disk-full case.  The mode is spelled
      # out because an unset one reaches podman as mode 000, which the docker
      # user of the image cannot write.
      - type: tmpfs
        target: /mnt/spool-full
        tmpfs:
          size: 33554432
          mode: 01777
    depends_on:
      - source
      - source14
      - target
